databases:
  - name: truthlens-db
    plan: free
    databaseName: truthlens
    user: truthlens

services:
  # Backend API
  - type: web
    name: truthlens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: truthlens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.fireworks.ai/inference/v1
      - key: AI_MODEL
        value: accounts/fireworks/models/llama-v3p1-70b-instruct
      - key: DEBUG
        value: "false"
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: web
    name: truthlens-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: truthlens-api
          type: web
          property: hostport
